[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-stock"
version = "0.1.0"
description = "Offline Decision Transformer and continuous-control baselines for NASDAQ-100 position management."
requires-python = ">=3.10"
dependencies = [
    "gym-anytrading",
    "gymnasium",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "stable-baselines3",
    "torch",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast in-memory unit tests",
    "integration: integration tests that touch real data files",
]
filterwarnings = [
    "ignore:.*invalid value encountered in divide.*:RuntimeWarning",
]
